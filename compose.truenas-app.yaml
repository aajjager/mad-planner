# Standalone configuration for TrueNAS SCALE 24.10+ "Install via YAML".
# Before installing, replace all CHANGE_THIS values, the image SHA, and dataset paths.
name: madplanner

services:
  media-init:
    image: alpine:3.22
    restart: "no"
    command: ["chown", "-R", "10001:10001", "/data/media"]
    volumes:
      - type: bind
        source: /mnt/tank/apps/mad-planner/media
        target: /data/media

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: madplanner
      POSTGRES_USER: madplanner
      POSTGRES_PASSWORD: "CHANGE_THIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madplanner -d madplanner"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - type: bind
        source: /mnt/tank/apps/mad-planner/postgres
        target: /var/lib/postgresql

  api:
    image: ghcr.io/aajjager/mad-planner-api:sha-REPLACE_WITH_GITHUB_SHA
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://madplanner:CHANGE_THIS_PASSWORD@db:5432/madplanner"
      MEDIA_ROOT: /data/media
      MFA_ENCRYPTION_KEY: "CHANGE_THIS_FERNET_KEY"
    volumes:
      - type: bind
        source: /mnt/tank/apps/mad-planner/media
        target: /data/media
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: ghcr.io/aajjager/mad-planner-web:sha-REPLACE_WITH_GITHUB_SHA
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
